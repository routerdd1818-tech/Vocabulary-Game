<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" shape-rendering="crispEdges">
  <rect width="192" height="192" fill="#14121d"/>
  <!-- Border -->
  <rect x="8" y="8" width="176" height="176" fill="none" stroke="#c89b3c" stroke-width="8"/>
  <rect x="16" y="16" width="160" height="160" fill="#201a2d"/>
  <!-- Pixel Dungeon Stone Motif -->
  <rect x="24" y="24" width="60" height="20" fill="#2d2440"/>
  <rect x="92" y="24" width="76" height="20" fill="#282038"/>
  <rect x="24" y="52" width="80" height="20" fill="#282038"/>
  <rect x="112" y="52" width="56" height="20" fill="#2d2440"/>
  <!-- Crossed Pixel Swords & Shield in Center -->
  <!-- Shield Backing -->
  <rect x="72" y="72" width="48" height="60" fill="#5a3d75"/>
  <rect x="76" y="76" width="40" height="52" fill="#7d58a1"/>
  <polygon points="72,132 120,132 96,160" fill="#5a3d75"/>
  <polygon points="76,132 116,132 96,154" fill="#7d58a1"/>
  <!-- Shield Emblem (Golden Book / Word V) -->
  <rect x="84" y="88" width="24" height="28" fill="#ffd700"/>
  <rect x="88" y="92" width="16" height="20" fill="#c89b3c"/>
  <rect x="94" y="94" width="4" height="16" fill="#14121d"/>
  <!-- Sword 1 Diagonal Left to Right -->
  <rect x="40" y="44" width="12" height="12" fill="#c89b3c"/>
  <rect x="52" y="56" width="8" height="8" fill="#e0e0e0"/>
  <rect x="60" y="64" width="8" height="8" fill="#ffffff"/>
  <rect x="124" y="128" width="8" height="8" fill="#ffffff"/>
  <rect x="132" y="136" width="8" height="8" fill="#e0e0e0"/>
  <rect x="140" y="144" width="12" height="12" fill="#c89b3c"/>
  <!-- Glowing Torch Fire Top -->
  <rect x="90" y="32" width="12" height="8" fill="#ff4422"/>
  <rect x="92" y="26" width="8" height="8" fill="#ff9900"/>
  <rect x="94" y="22" width="4" height="6" fill="#ffff44"/>
</svg>
