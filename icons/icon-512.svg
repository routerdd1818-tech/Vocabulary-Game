  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#c89b3c" stroke-width="20"/>
  <rect x="44" y="44" width="424" height="424" fill="#201a2d"/>
  <!-- Dungeon Stone Blocks -->
  <rect x="64" y="64" width="160" height="48" fill="#2d2440"/>
  <rect x="240" y="64" width="208" height="48" fill="#282038"/>
  <rect x="64" y="128" width="220" height="48" fill="#282038"/>
